name: Build PvPHelper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q *.zip -d project

      - name: Build
        run: |
          PROJECT=$(find project -name build.gradle -type f -print -quit | xargs dirname)
          cd "$PROJECT"
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PvPHelper-JAR
          path: project/**/build/libs/*.jar
