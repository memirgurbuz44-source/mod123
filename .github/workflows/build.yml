name: Build PvPHelper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: |
          unzip -q *.zip -d project
          find project -name build.gradle -exec dirname {} \; | head -1

      - name: Build
        run: |
          PROJECT=$(dirname "$(find project -name build.gradle | head -1)")
          cd "$PROJECT"
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PvPHelper-JAR
          path: project/**/build/libs/*.jar
